name: Release WordPress plugin
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and PHP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test -f ires-pdf-reader/ires-pdf-reader.php
          grep -Fq "Version: ${VERSION}" ires-pdf-reader/ires-pdf-reader.php
          find ires-pdf-reader -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Package
        run: zip -qr ires-pdf-reader.zip ires-pdf-reader -x '*.DS_Store' '*__MACOSX*'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ires-pdf-reader.zip --generate-notes --verify-tag
